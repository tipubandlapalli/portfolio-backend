name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            script: |
              set -e

              cd ~/books-project

              git pull origin main

              source venv/bin/activate
              pip install -r requirements.txt

              ps aux | grep "uvicorn src.main:app" | grep -v grep | awk '{print $2}' | xargs -r kill
              sleep 2

              nohup uvicorn src.main:app --host 127.0.0.1 --port 8000 --reload > app.log 2>&1 < /dev/null &

